server:
  port: 8081

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/product
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        id:
          uuid_generation_strategy: org.hibernate.id.uuid.StandardRandomStrategy
        dialect: org.hibernate.dialect.PostgreSQLDialect
  liquibase:
    enabled: true
    changelog: classpath:db/changelog/db.changelog-master.yaml
